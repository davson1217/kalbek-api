services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: kalbek-api-app
    container_name: kalbek-api-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - composer-cache:/tmp/composer-cache
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache
    networks:
      - kalbek

  nginx:
    image: nginx:1.27-alpine
    container_name: kalbek-api-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - kalbek

  vite:
    build:
      context: .
      dockerfile: Dockerfile
      target: node
    image: kalbek-api-node
    container_name: kalbek-api-vite
    working_dir: /var/www/html
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - .:/var/www/html
      - node-modules:/var/www/html/node_modules
    networks:
      - kalbek

  queue:
    image: kalbek-api-app
    container_name: kalbek-api-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=1 --tries=3 --timeout=120
    volumes:
      - .:/var/www/html
    depends_on:
      - app
      - redis
      - mysql
    networks:
      - kalbek

  scheduler:
    image: kalbek-api-app
    container_name: kalbek-api-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: sh -lc "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - .:/var/www/html
    depends_on:
      - app
      - redis
      - mysql
    networks:
      - kalbek

  mysql:
    image: mysql:8.4
    container_name: kalbek-api-mysql
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-kalbek}"
      MYSQL_USER: "${DB_USERNAME:-kalbek}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-rootsecret}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - kalbek

  redis:
    image: redis:7.4-alpine
    container_name: kalbek-api-redis
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6380}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - kalbek

  mailpit:
    image: axllent/mailpit:latest
    container_name: kalbek-api-mailpit
    restart: unless-stopped
    ports:
      - "${FORWARD_MAILPIT_PORT:-8025}:8025"
    networks:
      - kalbek

networks:
  kalbek:
    driver: bridge

volumes:
  composer-cache:
  mysql-data:
  node-modules:
  redis-data:
